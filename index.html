<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SKY">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="shared/theme.css">
<title>SKY</title>
</head>
<body>
<div id="app">
  <header><div class="hl"><h1 id="title">SKY</h1></div></header>
  <div id="upd"></div>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<script src="shared/tools.js"></script>
<script src="shared/common.js"></script>
<script>
let view='apps';

function render(){
  document.getElementById('title').textContent=view==='apps'?'SKY':'Ayarlar';
  document.getElementById('nav').innerHTML=[['apps','🧩','Araçlar'],['set','⚙️','Ayarlar']]
    .map(([v,i,t])=>`<button class="${view===v?'on':''}" onclick="go('${v}')"><i>${i}</i>${t}</button>`).join('');
  document.getElementById('main').innerHTML=view==='apps'?vApps():vSet();
}
const go=v=>{view=v;render();document.getElementById('main').scrollTop=0};

function vApps(){
  return `<div class="card hero"><small>Hoş geldin</small><div class="big">SKY</div><small>${TOOLS.length} araç ekli · birini seç</small></div>`
  +TOOLS.map(t=>`<a class="tool" href="${t.path}index.html"><div class="ic" style="background:hsl(${t.hue} 85% 55% / .2)">${t.icon}</div><div><b>${esc(t.name)}</b><div class="sub">${esc(t.desc)}</div></div><span class="go">›</span></a>`).join('')
  +`<div class="hint">Yeni araçlar eklendikçe burada listelenir.</div>`;
}

function vSet(){
  const apk=apkUrl(),rel=releaseUrl(),ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  let apkCard;
  if(isNative()){
    apkCard=`<div class="sub">Android uygulamasını kullanıyorsun. Yeni sürümler açılışta bildirilir.</div>${rel?`<a class="btn sec" href="${esc(rel)}" target="_blank" rel="noopener">Sürüm sayfasını aç</a>`:''}`;
  }else if(ios){
    apkCard=`<div class="sub">iPhone'a APK yüklenemez. Bunun yerine Safari'de <b>Paylaş → Ana Ekrana Ekle</b> ile uygulama gibi kurabilirsin.</div>`;
  }else if(!apk){
    apkCard=`<div class="sub">İndirme bağlantısı, uygulama GitHub Pages (github.io) adresinden açıldığında oluşur.</div>`;
  }else{
    apkCard=`<div class="sub" style="margin-bottom:10px">Android telefona uygulama olarak kur. İndirdikten sonra dosyaya dokunup yüklemeyi onayla; "bilinmeyen kaynak" izni istenebilir.</div>
    <a class="btn" href="${esc(apk)}" target="_blank" rel="noopener" style="margin-top:0">⬇ Android APK'yı indir</a>
    <a class="btn sec" href="${esc(rel)}" target="_blank" rel="noopener">Tüm sürümler</a>`;
  }
  return `<h2>ANDROID UYGULAMASI</h2><div class="card">${apkCard}</div>
  <h2>YEDEK</h2><div class="card">
    <div class="sub" style="margin-bottom:8px">Tüm araçların verileri yalnızca bu cihazda durur. Yedek, hepsini tek dosyada toplar.</div>
    <button class="btn sec" style="margin-top:0" onclick="exportAll()">Yedeği indir (JSON)</button>
    <button class="btn sec" onclick="copyAll()">Yedeği panoya kopyala</button>
    <button class="btn sec" onclick="document.getElementById('imp').click()">Yedekten yükle</button>
    <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importAll(this)">
    <button class="btn del" onclick="resetAll()">Tüm araçların verilerini sil</button></div>
  <div class="hint" style="text-align:center">SKY sürüm ${APP_VERSION}${hasBuild?' · derleme '+BUILD:''}</div>`;
}

function exportData(){
  const out={sky:1,date:new Date().toISOString(),tools:{}};
  TOOLS.forEach(t=>{try{const v=localStorage.getItem(t.key);if(v)out.tools[t.id]=JSON.parse(v)}catch(e){}});
  return out;
}
function exportAll(){
  const b=new Blob([JSON.stringify(exportData(),null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sky-yedek-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
}
function copyAll(){
  const txt=JSON.stringify(exportData());
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Kopyalandı')).catch(()=>toast('Kopyalanamadı, indirmeyi dene'));
}
function importAll(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result),map={};
    if(d&&d.sky&&d.tools){TOOLS.forEach(t=>{if(d.tools[t.id])map[t.id]=d.tools[t.id]})}
    else if(d&&d.recurring&&d.oneoff&&d.actuals)map.budget=d;   /* eski, yalnızca bütçe yedeği */
    else if(d&&d.days&&d.cfg)map.mesai=d;
    const ids=Object.keys(map);if(!ids.length)throw 0;
    const names=ids.map(id=>TOOLS.find(t=>t.id===id).name).join(', ');
    ask(names+' verisi bu yedekle değiştirilsin mi?','Evet, yükle',()=>{
      ids.forEach(id=>localStorage.setItem(TOOLS.find(t=>t.id===id).key,JSON.stringify(map[id])));
      closeSheet();render();toast('Yüklendi');
    },closeSheet);
  }catch(e){toast('Geçersiz yedek dosyası')}};
  r.readAsText(f);inp.value='';
}
function resetAll(){
  ask('Tüm araçların verileri silinecek ve geri alınamaz. Emin misin?','Evet, hepsini sil',()=>{
    TOOLS.forEach(t=>{try{localStorage.removeItem(t.key)}catch(e){}});closeSheet();render();toast('Tüm veriler silindi');
  },closeSheet);
}

render();
checkUpdate();
</script>
</body>
</html>
