name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Sabit imza anahtarını yerleştir ve doğrula
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret'ı tanımlı değil. Anahtar sabit olmazsa her derleme farklı imzalanır ve APK güncellemesi kurulamaz. README'deki 'sabit imza' bölümüne bak."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null
          echo "KS_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "Sabit anahtar kullanılıyor."

      - name: Bağımlılıkları kur
        run: npm install

      - name: Web dosyalarını www klasörüne kopyala
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest sw.js icon-*.png shared tools www/

      - name: Sürüm bilgisini uygulamaya göm (güncelleme bildirimi için)
        run: sed -i "s#__BUILD__#${{ github.run_number }}#; s#__REPO__#${{ github.repository }}#" www/shared/common.js

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Uygulama ikonunu uygula
        run: |
          RES=android/app/src/main/res
          rm -rf "$RES"/mipmap-anydpi-v26
          for d in "$RES"/mipmap-*; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp icon-192.png "$d/$n.png"
            done
          done

      - name: Sürüm numarasını her derlemede artır
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Release derlemesini secret'taki anahtarla imzala (açıkça tanımlı)
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  skyRelease {
                      storeFile file(System.getenv('KS_FILE'))
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.skyRelease
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF

      - name: Web dosyalarını Android projesine aktar
        run: npx cap sync android

      - name: APK derle (release; olmazsa debug)
        working-directory: android
        run: |
          if ./gradlew assembleRelease; then
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::Release derlemesi başarısız oldu, debug derlemesi kullanılıyor."
            ./gradlew assembleDebug
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: APK dosyasını adlandır
        run: cp "$GITHUB_WORKSPACE/$APK_PATH" sky.apk

      - name: İmza parmak izini al
        id: sig
        run: |
          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          SHA=""
          if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
            SHA=$("$BT/apksigner" verify --print-certs sky.apk 2>/dev/null | grep -m1 'SHA-256' | sed 's/.*: *//') || true
          fi
          if [ -z "$SHA" ]; then
            SHA=$(keytool -printcert -jarfile sky.apk 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//') || true
          fi
          echo "İmza SHA-256: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # APK'nın gerçekten secret'taki anahtarla imzalandığını doğrula; değilse yayınlama
          KSSHA=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-Z' 'a-z') || true
          APKSHA=$(echo "$SHA" | tr -d ':' | tr 'A-Z' 'a-z')
          if [ -z "$KSSHA" ] || [ -z "$APKSHA" ]; then
            echo "::warning::İmza parmak izi karşılaştırılamadı (anahtar: '$KSSHA', APK: '$APKSHA')."
          elif [ "$KSSHA" != "$APKSHA" ]; then
            echo "::error::APK, secret'taki anahtarla imzalanmadı (anahtar: $KSSHA, APK: $APKSHA). Bu APK güncelleme olarak kurulamaz, yayınlanmadı."
            exit 1
          else
            echo "APK imzası secret'taki anahtarla eşleşiyor."
          fi

      - name: Çıktı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: sky-apk
          path: sky.apk

      - name: latest etiketini bu commit'e taşı
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest

      - name: Release'i güncelle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Son APK
          body: |
            Her güncellemede otomatik derlenen son APK. Derleme numarası: ${{ github.run_number }}
            İmza SHA-256: ${{ steps.sig.outputs.sha }}

            Güncelleme kurulamazsa: imza parmak izi önceki sürümle aynı olmalıdır. Farklıysa eski uygulamayı bir kez kaldırıp yenisini kur (önce Ayarlar'dan yedek al).
          files: sky.apk
          make_latest: true
