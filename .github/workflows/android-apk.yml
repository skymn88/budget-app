name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur
        run: npm install

      - name: Web dosyalarını www klasörüne kopyala
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest sw.js icon-*.png shared tools www/

      - name: Sürüm bilgisini uygulamaya göm (güncelleme bildirimi için)
        run: sed -i "s#__BUILD__#${{ github.run_number }}#; s#__REPO__#${{ github.repository }}#" www/shared/common.js

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Uygulama ikonunu uygula
        run: |
          RES=android/app/src/main/res
          rm -rf "$RES"/mipmap-anydpi-v26
          for d in "$RES"/mipmap-*; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp icon-192.png "$d/$n.png"
            done
          done

      - name: Sürüm numarasını her derlemede artır
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Sabit imza anahtarını yerleştir (secret tanımlıysa)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Sabit anahtar kullanılıyor."
          else
            echo "Secret yok, geçici anahtar kullanılacak."
          fi

      - name: Web dosyalarını Android projesine aktar
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK dosyasını adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sky.apk

      - name: Çıktı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: sky-apk
          path: sky.apk

      - name: latest etiketini bu commit'e taşı
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest

      - name: Release'i güncelle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Son APK
          body: "Her güncellemede otomatik derlenen son APK. Derleme numarası: ${{ github.run_number }}"
          files: sky.apk
          make_latest: true

      - name: Eski adlı APK dosyasını release'ten kaldır (varsa)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset latest butcem.apk --yes || true
